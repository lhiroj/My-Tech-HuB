<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI HUB</title>

<style>
:root{
  --bg:#f5f6fa;
  --surface:#fff;
  --surface2:#f0f1f7;
  --text:#171827;
  --muted:#777b8d;
  --primary:#6c4df6;
  --primary2:#9278ff;
  --border:#e5e6ee;
  --success:#28a56b;
  --danger:#e05252;
  --shadow:0 10px 30px rgba(30,25,70,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:22px 15px;
  z-index:30;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  padding:5px 10px 28px;
}

.logo-icon{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:900;
  font-size:20px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 8px 20px rgba(108,77,246,.25);
}

.logo-title{
  font-weight:800;
  font-size:17px;
}

.logo-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.nav-title{
  color:#a1a4b0;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  padding:10px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:12px;
  padding:13px 14px;
  margin:3px 0;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  transition:.18s;
}

.nav-btn:hover{
  background:#f1efff;
  color:var(--primary);
}

.nav-btn.active{
  background:#ece9ff;
  color:var(--primary);
  font-weight:750;
}

.nav-icon{
  width:22px;
  text-align:center;
  font-size:18px;
}

/* ================= MAIN ================= */

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-width:0;
  padding:24px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.search{
  width:340px;
  max-width:100%;
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:13px;
  outline:none;
  background:var(--surface);
  color:var(--text);
}

.search:focus{
  border-color:var(--primary);
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:12px;
}

/* ================= PAGES ================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  margin:0 0 6px;
  font-size:27px;
}

.page-subtitle{
  margin:0 0 22px;
  color:var(--muted);
}

/* ================= HOME ================= */

.hero{
  position:relative;
  overflow:hidden;
  padding:32px;
  min-height:225px;
  border-radius:25px;
  color:#fff;
  background:linear-gradient(135deg,#6244ef,#957cff);
  box-shadow:var(--shadow);
}

.hero:after{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  right:-50px;
  top:-70px;
}

.hero h1{
  position:relative;
  z-index:1;
  margin:0 0 10px;
  font-size:32px;
}

.hero p{
  position:relative;
  z-index:1;
  max-width:650px;
  line-height:1.6;
  opacity:.9;
}

.primary-btn{
  border:0;
  background:var(--primary);
